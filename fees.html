<section><h2>Calculate your total</h2><p>Tick what you want, then press Calculate. This is only a quote, not an invoice.</p>
<div class="formwrap"><div class="formbox">

<label>Email<input type="text" id="cemail" placeholder="you@email.com"></label>
<label>Preferred contact time<select id="ctime"><option value="">Choose...</option><option>Morning</option><option>Afternoon</option><option>Evening</option></select></label>
<div id="checks"></div>
<p id="error" class="error"></p>
<button class="btn" id="calcBtn">Calculate</button> <button class="btn alt" id="requestBtn">Request a consultant</button></div>
